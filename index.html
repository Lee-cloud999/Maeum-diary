<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3a34">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>마음편지</title>
<style>
:root{--bg:#f4f5f2;--card:#fff;--ink:#22302b;--sub:#7b8a84;--main:#5b8f7b;--main2:#e3efe9;--warn:#c8664f;--line:#e6ebe8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Noto Sans KR",sans-serif;padding-bottom:80px}
header{padding:20px 20px 8px;font-size:22px;font-weight:700}
header small{display:block;font-size:13px;color:var(--sub);font-weight:400;margin-top:2px}
main{padding:0 16px}
.card{background:var(--card);border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 1px 6px rgba(0,0,0,.04)}
h3{margin:0 0 12px;font-size:16px}
.slider{display:flex;justify-content:space-between;gap:8px}
.slider button{flex:1;font-size:26px;padding:10px 0;border:2px solid var(--line);border-radius:14px;background:#fff}
.slider button.on{border-color:var(--main);background:var(--main2)}
.group{font-size:12px;color:var(--sub);margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fafbfa;border-radius:20px;padding:8px 14px;font-size:14px}
.chip.on{background:var(--main);color:#fff;border-color:var(--main)}
textarea,input[type=text],input[type=password]{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;font-family:inherit;background:#fafbfa}
textarea{min-height:90px;resize:vertical}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:600;background:var(--main);color:#fff;margin-top:12px}
.btn.ghost{background:var(--main2);color:var(--main)}
.btn:disabled{opacity:.5}
.prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:#f2b630;border-radius:6px}
.muted{color:var(--sub);font-size:13px}
.letter{white-space:pre-wrap;line-height:1.8;font-size:15px}
.letter-date{font-size:12px;color:var(--sub);margin-bottom:8px}
.rec .top{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.rec .tags{margin:6px 0;display:flex;gap:6px;flex-wrap:wrap}
.rec .tags span{background:var(--main2);color:var(--main);border-radius:10px;padding:3px 9px;font-size:12px}
.rec p{margin:4px 0 0;font-size:14px;line-height:1.6}
.del{border:0;background:none;color:var(--sub);font-size:12px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:12px 0 10px;font-size:12px;color:var(--sub)}
nav button b{display:block;font-size:20px;margin-bottom:2px;font-weight:400}
nav button.on{color:var(--main);font-weight:700}
.view{display:none}.view.on{display:block}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#22302bdd;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;max-width:86%;text-align:center}
.toast.show{opacity:1}
label{font-size:13px;color:var(--sub);display:block;margin:12px 0 6px}

.envs{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:8px 0}
.env{background:none;border:0;padding:0;text-align:center;position:relative}
.env svg{width:100%;height:auto;filter:drop-shadow(0 4px 5px rgba(140,100,80,.18))}
.env:active svg{transform:scale(.97)}
.env .d{font-size:12px;color:var(--sub);margin-top:2px}
.env .new{position:absolute;top:6px;right:8px;background:#ff8fa3;color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;z-index:1;animation:pop 1.6s ease-in-out infinite}
@keyframes pop{50%{transform:scale(1.12)}}
.modal{position:fixed;inset:0;background:rgba(70,50,40,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.on{display:flex}
.sheet{width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:0 14px 22px;animation:up .4s ease}
@keyframes up{from{transform:translateY(50px);opacity:0}to{transform:none;opacity:1}}
.dog{display:block;margin:0 auto -30px;position:relative;z-index:2;width:130px;animation:bob 3s ease-in-out infinite}
.dog svg{width:100%;height:auto}
@keyframes bob{50%{transform:translateY(-5px)}}
.paper{position:relative;background:#fffaf0 repeating-linear-gradient(transparent 0 31px,#f1e5d0 31px 32px);border-radius:20px;padding:42px 22px 18px;box-shadow:0 8px 28px rgba(0,0,0,.22);outline:4px dashed #f5c3d0;outline-offset:-10px}
.paper .letter{line-height:32px;font-size:15px}
.paper .letter-date{margin-bottom:10px}
.close{display:block;margin:14px auto 0;border:0;background:#f5c3d0;color:#7a4a56;border-radius:20px;padding:10px 28px;font-size:15px;font-weight:600}
.dogrow{display:flex;align-items:center;gap:10px}
.dogrow .sm{width:64px;flex:none}
.dogrow h3{margin:0}
</style>
</head>
<body>
<header id="hd">마음편지<small id="sub"></small></header>
<main>

<section class="view on" id="v-write">
  <div class="card">
    <h3>지금 기분이 어때?</h3>
    <div class="slider" id="mood"></div>
    <div class="group">중립</div><div class="chips" id="c-neu"></div>
    <div class="group">긍정</div><div class="chips" id="c-pos"></div>
    <div class="group">부정</div><div class="chips" id="c-neg"></div>
  </div>
  <div class="card">
    <h3>한 줄 메모</h3>
    <textarea id="memo" placeholder="오늘 있었던 일, 지금 드는 생각을 편하게 적어줘"></textarea>
    <button class="btn" id="save">기록하기</button>
  </div>
  <div class="card">
    <div class="dogrow"><div class="sm" id="dogSm"></div><h3>내일의 편지</h3></div>
    <div class="prog"><i id="pbar"></i></div>
    <div class="muted" id="ptxt"></div>
    <button class="btn ghost" id="getLetter">지금 편지 받기</button>
  </div>
</section>

<section class="view" id="v-letters"><div id="letters"></div></section>
<section class="view" id="v-history"><div id="history"></div></section>

<section class="view" id="v-settings">
  <div class="card">
    <h3>설정</h3>
    <label>내 이름 (편지에서 불러줄 이름)</label>
    <input type="text" id="s-name" placeholder="예: 나은">
    <label>편지 쓰는 친구 이름</label>
    <input type="text" id="s-char" placeholder="예: 마음이">
    <label>Anthropic API 키 (이 기기에만 저장돼)</label>
    <input type="password" id="s-key" placeholder="sk-ant-...">
    <label>모델</label>
    <input type="text" id="s-model" placeholder="claude-sonnet-5-5">
    <label>편지 말투</label>
    <div class="chips" id="s-tone"></div>
    <button class="btn" id="s-save">저장</button>
    <p class="muted">API 키가 없으면 간단한 기본 편지가 만들어져요. 키는 브라우저 로컬에만 저장되니, 본인 폰에서만 쓰는 용도로 권장해요.</p>
  </div>
  <div class="card">
    <h3>데이터</h3>
    <button class="btn ghost" id="export">기록 내보내기 (JSON)</button>
    <button class="btn ghost" id="wipe" style="color:var(--warn)">모든 기록 삭제</button>
  </div>
</section>
</main>

<nav id="nav">
  <button data-v="write" class="on"><b>✏️</b>기록</button>
  <button data-v="letters"><b>💌</b>편지함</button>
  <button data-v="history"><b>📅</b>히스토리</button>
  <button data-v="settings"><b>⚙️</b>설정</button>
</nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<svg width="0" height="0" style="position:absolute"><filter id="yarn"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.5"/></filter></svg>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const EMO={neu:['그저 그런','그리운','시원섭섭한','심심한','무기력한','지루한','무감한','고민되는','궁금한','놀란','혼란스러운'],
pos:['신나는','열정적인','즐거운','의욕적인','상쾌한','뿌듯한','사랑하는','행복한','설레는'],
neg:['답답한','불안한','걱정되는','우울한','화나는','외로운','지친','속상한','짜증나는','후회되는']};
const MOODS=['😞','😕','😐','🙂','😄'];
const TONES=['다정한 반말','정중한 존댓말'];
const REQ=5;
const L={get(k,d){try{return JSON.parse(localStorage.getItem('mp_'+k))??d}catch(e){return d}},set(k,v){localStorage.setItem('mp_'+k,JSON.stringify(v))}};
let records=L.get('records',[]), letters=L.get('letters',[]), cfg=L.get('cfg',{name:'',char:'마음이',key:'',model:'claude-sonnet-5-5',tone:0});
let mood=null, picked=new Set();


/* ---------- 푸들 캐릭터 & 털실 편지봉투 ---------- */
function poodle(happy){
  const F='#d9b48a',D='#bf9463',L='#efd9bb',I='#4a3626';
  const curl=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${F}" stroke="${D}" stroke-width="1.2"/>`;
  return `<svg viewBox="0 0 120 118" xmlns="http://www.w3.org/2000/svg">
  ${curl(22,64,14)}${curl(18,80,13)}${curl(25,94,12)}${curl(98,64,14)}${curl(102,80,13)}${curl(95,94,12)}
  <circle cx="60" cy="68" r="31" fill="${F}" stroke="${D}" stroke-width="1.2"/>
  ${curl(45,30,13)}${curl(60,22,15)}${curl(75,30,13)}${curl(52,40,12)}${curl(68,40,12)}
  <ellipse cx="60" cy="79" rx="16" ry="12" fill="${L}"/>
  <circle cx="47" cy="65" r="4.2" fill="${I}"/><circle cx="73" cy="65" r="4.2" fill="${I}"/>
  <circle cx="48.4" cy="63.6" r="1.4" fill="#fff"/><circle cx="74.4" cy="63.6" r="1.4" fill="#fff"/>
  <circle cx="38" cy="76" r="5" fill="#f4a9b8" opacity=".55"/><circle cx="82" cy="76" r="5" fill="#f4a9b8" opacity=".55"/>
  <ellipse cx="60" cy="73" rx="5.2" ry="3.7" fill="${I}"/>
  <path d="M60 77v3M60 80q-4 5-8 1M60 80q4 5 8 1" stroke="${I}" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  ${happy?'<path d="M56 84q4 9 8 0z" fill="#f28ea1"/>':''}
  <circle cx="42" cy="110" r="10" fill="${L}" stroke="${D}" stroke-width="1.2"/><circle cx="78" cy="110" r="10" fill="${L}" stroke="${D}" stroke-width="1.2"/>
  </svg>`;
}
const ENV_C=['#f9d0dc','#cfe8dd','#d9d2f2','#fbe6b8','#cfe3f7'];
const ENV_D=['#e79db4','#95c6b1','#ad9fe0','#ecbd62','#93bce4'];
function envelope(ci,open){
  ci=((ci%5)+5)%5;const c=ENV_C[ci],d=ENV_D[ci],id='yp'+ci;
  const pat=`<pattern id="${id}" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="8" height="8" fill="${c}"/><path d="M0 2Q2 0 4 2T8 2M0 6Q2 4 4 6T8 6" stroke="${d}" stroke-width="1.6" fill="none" opacity=".5"/></pattern>`;
  const stitch='fill="none" stroke="#fff" stroke-width="1.8" stroke-dasharray="4 4" stroke-linecap="round" opacity=".9"';
  const pom=[0,1,2,3,4,5,6,7].map(k=>{const a=k*Math.PI/4;return `<circle cx="${100+Math.cos(a)*9}" cy="${90+Math.sin(a)*9}" r="6" fill="${d}"/>`}).join('')+`<circle cx="100" cy="90" r="8" fill="${c}" stroke="${d}"/>`;
  if(!open) return `<svg viewBox="0 -8 200 148"><defs>${pat}</defs><g filter="url(#yarn)">
    <rect x="10" y="30" width="180" height="104" rx="12" fill="url(#${id})"/>
    <path d="M10 134L84 78M190 134L116 78" stroke="${d}" stroke-width="2" opacity=".5" fill="none"/>
    <path d="M10 42Q10 30 22 30H178Q190 30 190 42L100 104Z" fill="url(#${id})" stroke="${d}" stroke-width="1.5"/>
    <path d="M18 38L100 96L182 38" ${stitch}/><rect x="16" y="36" width="168" height="92" rx="9" ${stitch} opacity=".6"/>
    ${pom}</g></svg>`;
  return `<svg viewBox="0 -8 200 148"><defs>${pat}</defs><g filter="url(#yarn)">
    <rect x="10" y="30" width="180" height="104" rx="12" fill="url(#${id})"/>
    <rect x="28" y="6" width="144" height="86" rx="6" fill="#fffaf0" stroke="#efe2cc"/>
    <path d="M40 30h120M40 44h120M40 58h90" stroke="#f0e2ca" stroke-width="2"/>
    <path d="M10 134V42L100 104L190 42V134Q190 134 178 134H22Q10 134 10 134Z" fill="url(#${id})" stroke="${d}" stroke-width="1.5"/>
    <path d="M18 46L100 100L182 46" ${stitch}/>
    <path d="M12 32L100 -6L188 32Z" fill="${c}" stroke="${d}" stroke-width="1.5" opacity=".9"/></g></svg>`;
}
function openModal(html){$('#sheet').innerHTML=html;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on');renderLetters()}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.classList.contains('close'))closeModal()});
function openLetter(i){
  const l=letters[i];if(!l)return;l.read=true;L.set('letters',letters);
  openModal(`<div class="dog">${poodle(true)}</div><div class="paper"><div class="letter-date">${fmt(l.at)} · ${esc(l.from||'')}</div><div class="letter">${esc(l.text)}</div></div><button class="close">닫기</button>`);
}

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function fmt(ts){const d=new Date(ts);return `${d.getMonth()+1}월 ${d.getDate()}일 ${d.getHours()<12?'오전':'오후'} ${String(d.getHours()%12||12).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function buildChips(){
  for(const [k,id] of [['neu','#c-neu'],['pos','#c-pos'],['neg','#c-neg']]){
    $(id).innerHTML=EMO[k].map(w=>`<button class="chip" data-w="${w}">${w}</button>`).join('');
  }
  $('#mood').innerHTML=MOODS.map((m,i)=>`<button data-m="${i+1}">${m}</button>`).join('');
  $('#s-tone').innerHTML=TONES.map((t,i)=>`<button class="chip" data-t="${i}">${t}</button>`).join('');
}
document.addEventListener('click',e=>{
  const c=e.target.closest('.chip[data-w]');
  if(c){const w=c.dataset.w;picked.has(w)?picked.delete(w):picked.size<3&&picked.add(w);if(picked.size===3&&!picked.has(w)){}
    document.querySelectorAll('.chip[data-w]').forEach(x=>x.classList.toggle('on',picked.has(x.dataset.w)));return}
  const m=e.target.closest('#mood button');
  if(m){mood=+m.dataset.m;document.querySelectorAll('#mood button').forEach(x=>x.classList.toggle('on',+x.dataset.m===mood))}
  const t=e.target.closest('#s-tone .chip');
  if(t){cfg.tone=+t.dataset.t;renderTone()}
});
function renderTone(){document.querySelectorAll('#s-tone .chip').forEach(x=>x.classList.toggle('on',+x.dataset.t===cfg.tone))}

document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));
function show(v){
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));
  document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x.dataset.v===v));
  if(v==='letters')renderLetters(); if(v==='history')renderHistory(); window.scrollTo(0,0);
}

function pending(){const last=letters.length?letters[0].at:0;return records.filter(r=>r.at>last)}
function renderProgress(){
  const n=Math.min(pending().length,REQ);
  $('#pbar').style.width=(n/REQ*100)+'%';
  $('#ptxt').textContent=n>=REQ?'편지가 준비됐어! 지금 받아볼 수 있어.':`감정을 ${REQ-n}번 더 기록하면 편지를 받을 수 있어 (${n}/${REQ})`;
  $('#sub').textContent=`${cfg.name?cfg.name+'님, ':''}오늘도 마음을 남겨봐요`;
}

$('#save').onclick=()=>{
  if(!mood)return toast('기분을 먼저 골라줘');
  if(!picked.size&&!$('#memo').value.trim())return toast('감정이나 메모를 하나는 적어줘');
  records.unshift({at:Date.now(),mood,emotions:[...picked],memo:$('#memo').value.trim()});
  L.set('records',records);
  mood=null;picked.clear();$('#memo').value='';
  document.querySelectorAll('.chip[data-w],#mood button').forEach(x=>x.classList.remove('on'));
  renderProgress();toast('기록했어요 ✨');
};

function renderLetters(){
  $('#letters').innerHTML=letters.length?`<div class="envs">${letters.map((l,i)=>`<button class="env" data-i="${i}">${l.read?'':'<span class="new">NEW</span>'}${envelope(letters.length-1-i,!!l.read)}<div class="d">${fmt(l.at)}</div></button>`).join('')}</div>`
   :`<div class="card muted" style="text-align:center"><div style="width:90px;margin:0 auto 8px">${poodle(false)}</div>아직 받은 편지가 없어요.<br>감정을 기록하면 ${esc(cfg.char||'마음이')}가 편지를 써줄 거예요.</div>`;
  document.querySelectorAll('.env').forEach(b=>b.onclick=()=>openLetter(+b.dataset.i));
}
function renderHistory(){
  $('#history').innerHTML=records.length?records.map((r,i)=>`<div class="card rec"><div class="top"><span>${fmt(r.at)} ${MOODS[r.mood-1]}</span><button class="del" data-i="${i}">삭제</button></div><div class="tags">${r.emotions.map(e=>`<span>${esc(e)}</span>`).join('')}</div>${r.memo?`<p>${esc(r.memo)}</p>`:''}</div>`).join(''):'<div class="card muted">아직 기록이 없어요.</div>';
  document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{records.splice(+b.dataset.i,1);L.set('records',records);renderHistory();renderProgress()});
}

function fallbackLetter(recs){
  const avg=recs.reduce((a,r)=>a+r.mood,0)/recs.length;
  const emo=[...new Set(recs.flatMap(r=>r.emotions))].slice(0,4).join(', ')||'여러 마음';
  const nm=cfg.name||'너';
  return cfg.tone===0
   ?`${nm}에게,\n\n요즘 ${emo} 같은 마음이 자주 지나갔구나. ${avg>=3.5?'좋은 순간들이 꽤 있었네. 그 기분, 잠깐 더 누려도 돼.':avg>=2.5?'평범한 듯해도 하루하루를 잘 지나오고 있어.':'조금 무거운 날들이었을 것 같아. 그래도 이렇게 마음을 적어둔 것만으로 충분히 잘하고 있어.'}\n\n오늘은 따뜻한 물 한 잔 마시면서 천천히 쉬어가자. 기록해줘서 고마워.\n\n- ${cfg.char||'마음이'}가`
   :`${nm}님께,\n\n요즘 ${emo} 같은 마음이 자주 지나갔군요. ${avg>=3.5?'좋은 순간들도 꽤 있었네요. 그 기분을 잠시 더 누리셔도 좋아요.':avg>=2.5?'평범한 듯해도 하루하루를 잘 지나오고 계세요.':'조금 무거운 날들이었을 것 같아요. 마음을 적어두신 것만으로도 충분히 잘하고 계세요.'}\n\n오늘은 따뜻한 물 한 잔 드시며 천천히 쉬어가세요. 기록해주셔서 고마워요.\n\n- ${cfg.char||'마음이'} 드림`;
}

async function aiLetter(recs){
  const tone=cfg.tone===0?'다정한 반말':'따뜻한 존댓말';
  const sys=`너는 "${cfg.char||'마음이'}"라는 이름의 다정한 친구 캐릭터야. 사용자의 감정 기록을 읽고 편지를 써.
규칙:
- 한국어, ${tone}, 4~7문장 정도, 편지 형식(첫 줄에 받는 사람 호명, 마지막에 서명).
- 기록에 나온 구체적인 사건·감정·키워드를 짚어서 "읽었다"는 느낌을 줘. 없는 사실은 지어내지 마.
- 감정을 먼저 인정하고, 마지막에 오늘 해볼 수 있는 아주 작은 행동 하나만 제안해.
- 진단, 훈계, 과한 긍정, 뻔한 명언은 금지.
- 자해·자살 암시가 보이면 편지 대신 걱정하는 마음을 담아 주변 사람이나 전문가(자살예방상담전화 109)에게 연락해보길 부드럽게 권해.`;
  const list=recs.slice().reverse().map(r=>`[${fmt(r.at)}] 기분 ${r.mood}/5 | 감정: ${r.emotions.join(', ')||'-'} | 메모: ${r.memo||'-'}`).join('\n');
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':cfg.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:cfg.model||'claude-sonnet-5-5',max_tokens:700,system:sys,messages:[{role:'user',content:`${cfg.name?'이름: '+cfg.name+'\n':''}최근 감정 기록:\n${list}`}]})});
  if(!res.ok)throw new Error((await res.text()).slice(0,200));
  const j=await res.json();return j.content.map(c=>c.text||'').join('').trim();
}

$('#getLetter').onclick=async()=>{
  const recs=pending();
  if(recs.length<1)return toast('새 기록이 없어요. 먼저 감정을 기록해줘');
  if(recs.length<REQ&&!confirm(`기록이 ${recs.length}개뿐이야. 그래도 편지를 받을까?`))return;
  const b=$('#getLetter');b.disabled=true;b.textContent='편지 쓰는 중…';
  openModal(`<div class="dog">${poodle(false)}</div><div class="paper"><div class="muted" style="text-align:center;padding:18px 0">${esc(cfg.char||'마음이')}가 편지를 쓰고 있어요… ✏️</div></div>`);
  let text;
  try{text=cfg.key?await aiLetter(recs):fallbackLetter(recs);}
  catch(e){text=fallbackLetter(recs);toast('AI 연결 실패, 기본 편지로 대체했어요');console.error(e)}
  letters.unshift({at:Date.now(),text,from:cfg.char||'마음이'});L.set('letters',letters);
  b.disabled=false;b.textContent='지금 편지 받기';renderProgress();show('letters');openLetter(0);
};

$('#s-save').onclick=()=>{
  cfg.name=$('#s-name').value.trim();cfg.char=$('#s-char').value.trim()||'마음이';cfg.key=$('#s-key').value.trim();cfg.model=$('#s-model').value.trim()||'claude-sonnet-5-5';
  L.set('cfg',cfg);renderProgress();toast('저장했어요');
};
$('#export').onclick=()=>{const b=new Blob([JSON.stringify({records,letters},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='maeum-diary.json';a.click()};
$('#wipe').onclick=()=>{if(confirm('기록과 편지를 모두 삭제할까? 되돌릴 수 없어요.')){records=[];letters=[];L.set('records',[]);L.set('letters',[]);renderProgress();toast('삭제했어요')}};

buildChips();
$('#s-name').value=cfg.name;$('#s-char').value=cfg.char;$('#s-key').value=cfg.key;$('#s-model').value=cfg.model;renderTone();renderProgress();$('#dogSm').innerHTML=poodle(true);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
